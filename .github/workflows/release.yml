name: Release

# Publishes a finished VOAG release from the commit the current snapshot was
# built from: builds dist/ from src/ with the final version, runs all release
# checks, confirms the release says the same as the snapshot (apart from the
# version and dates), updates CHANGELOG.md and release.json on main, tags
# vX.Y.Z, creates a GitHub Release with the built files, and then removes the
# snapshot pre-release. GitHub only offers this workflow once it is on main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z): the current snapshot's version without -SNAPSHOT"
        required: true
        type: string
      skip_snapshot_check:
        description: "Release without checking against the snapshot (not recommended)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        env:
          version: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tag v$version already exists" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          last="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)"
          if [[ -n "$last" ]]; then
            IFS=. read -r LM Lm Lp <<< "$last"; IFS=. read -r M m p <<< "$version"
            if ! { [[ $M == $LM && $m == $Lm && $p == $((Lp+1)) ]] || [[ $M == $LM && $m == $((Lm+1)) && $p == 0 ]] || [[ $M == $((LM+1)) && $m == 0 && $p == 0 ]]; }; then
              echo "$version is not one step on from the last release $last" >> "$GITHUB_STEP_SUMMARY"; exit 1
            fi
          fi

      - name: Check against the snapshot
        if: ${{ !inputs.skip_snapshot_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
        run: |
          set -euo pipefail
          snap_sha="$(git rev-parse -q --verify 'refs/tags/snapshot^{commit}' || true)"
          if [[ -z "$snap_sha" ]]; then
            echo "There is no snapshot to release from: push to main first, or use skip_snapshot_check" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          if [[ "$snap_sha" != "$GITHUB_SHA" ]]; then
            echo "The snapshot was built from ${snap_sha::7}, but this run is on ${GITHUB_SHA::7}. Release from the snapshot's commit, or wait for a new snapshot." >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          mkdir -p snapshot
          gh release download snapshot --pattern "voag-${version}-SNAPSHOT.zip" --dir snapshot \
            || { echo "The snapshot is not version ${version}-SNAPSHOT" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          (cd snapshot && unzip -q "voag-${version}-SNAPSHOT.zip" && rm "voag-${version}-SNAPSHOT.zip")

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib pyshacl

      - name: Build and check the release
        run: python scripts/release.py --version "${{ inputs.version }}"

      - name: Compare the release with the snapshot
        if: ${{ !inputs.skip_snapshot_check }}
        run: python scripts/compare_snapshot.py snapshot dist "${{ inputs.version }}-SNAPSHOT" "${{ inputs.version }}"

      - name: Update CHANGELOG.md and release.json
        env:
          version: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import datetime, json, os
          version = os.environ["version"]
          today = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d")
          path = "CHANGELOG.md"
          text = open(path, encoding="utf-8").read()
          text = text.replace("## Unreleased", f"## Unreleased\n\n## {version} ({today})", 1)
          open(path, "w", encoding="utf-8").write(text)
          config = json.load(open("release.json"))
          major, minor, patch = (int(x) for x in version.split("."))
          config["version"] = f"{major}.{minor}.{patch + 1}"
          json.dump(config, open("release.json", "w"), indent=2)
          open("release.json", "a").write("\n")
          PY

      - name: Commit, tag and push
        env:
          version: ${{ inputs.version }}
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add CHANGELOG.md release.json
          git commit -m "Release $version"
          git tag "v$version"
          git push origin "HEAD:${GITHUB_REF_NAME}" "v$version"

      - name: Package the release
        run: cd dist && zip -qr "../voag-${{ inputs.version }}.zip" .

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: VOAG ${{ inputs.version }}
          make_latest: true
          files: |
            voag-${{ inputs.version }}.zip
            dist/**/*.ttl

      - name: Remove the snapshot pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete snapshot --cleanup-tag --yes || echo "no snapshot release to remove"
          echo "Released ${{ inputs.version }}; the snapshot pre-release has been removed until the next push." >> "$GITHUB_STEP_SUMMARY"
